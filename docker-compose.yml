services:
  db:
    image: postgres:16-alpine
    container_name: cfs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: careforsheperds
      POSTGRES_PASSWORD: careforsheperds
      POSTGRES_DB: careforsheperds
    ports:
      - "5435:5432"
    volumes:
      - cfs_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careforsheperds -d careforsheperds"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  cfs_postgres_data: